<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Tickets</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <main class="container">

        <h1>Sistema de Tickets</h1>

        <section class="ticket-form-section">

            <h2>Criar novo ticket</h2>

            <form id="ticket-form">

                <div class="form-group">
                    <label for="customerName">
                        Nome do cliente
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        name="customerName"
                        placeholder="Digite o nome do cliente"
                    >
                </div>

                <div class="form-group">
                    <label for="channel">
                        Canal de origem
                    </label>

                    <select
                        id="channel"
                        name="channel"
                    >
                        <option value="">
                            Selecione um canal
                        </option>

                        <option value="email">
                            Email
                        </option>

                        <option value="chat">
                            Chat
                        </option>

                        <option value="telefone">
                            Telefone
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="description">
                        Descrição do problema
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        rows="4"
                        placeholder="Descreva o problema do cliente"
                    ></textarea>
                </div>

                <button type="submit">
                    Criar ticket
                </button>

            </form>

            <p id="message"></p>

        </section>

        <section class="ticket-list-section">

            <h2>Tickets</h2>

            <div id="ticket-list">

                <!-- Os tickets serão inseridos aqui pelo JavaScript -->

            </div>

        </section>

    </main>

    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>

</body>

</html>
